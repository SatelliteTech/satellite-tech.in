           fill="none" 
           stroke="#1677FF" 
           stroke-width="7.2" 
           stroke-linejoin="round" 
           stroke-linecap="round"/>
  
  <!-- Inner S Geometric Path -->
  <path d="M 66,31.2 L 50,22 L 27,35.3 L 27,50 L 73,50 L 73,64.7 L 50,78 L 34,68.8" 
        fill="none" 
