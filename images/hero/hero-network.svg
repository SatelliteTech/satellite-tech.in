<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1677FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1677FF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Background grid pattern -->
  <rect width="600" height="400" fill="url(#gridGrad)" rx="16"/>

  <!-- Network Interconnections -->
  <g stroke="url(#lineGrad)" stroke-width="1.8" stroke-dasharray="4 3" opacity="0.75">
    <line x1="120" y1="180" x2="260" y2="110"/>
    <line x1="260" y1="110" x2="440" y2="130"/>
    <line x1="440" y1="130" x2="500" y2="240"/>
    <line x1="120" y1="180" x2="220" y2="280"/>
    <line x1="220" y1="280" x2="380" y2="290"/>
    <line x1="380" y1="290" x2="500" y2="240"/>
    <line x1="260" y1="110" x2="380" y2="290"/>
    <line x1="220" y1="280" x2="440" y2="130"/>
  </g>

  <!-- Central Satellite Tech Hub Node -->
  <g transform="translate(300, 200)">
    <circle r="38" fill="#071A2B" stroke="#1677FF" stroke-width="3"/>
    <circle r="46" fill="none" stroke="#22D3EE" stroke-width="1.5" stroke-dasharray="5 3" opacity="0.7"/>
    <!-- Official Satellite Tech Monogram Emblem -->
    <g transform="translate(-20, -20) scale(0.4)">
      <polygon points="50,6 88.1,28 88.1,72 50,94 11.9,72 11.9,28" 
               fill="none" stroke="#22D3EE" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M 66,31.2 L 50,22 L 27,35.3 L 27,50 L 73,50 L 73,64.7 L 50,78 L 34,68.8" 
            fill="none" stroke="#FFFFFF" stroke-width="7.5" stroke-linejoin="round" stroke-linecap="round"/>
      <line x1="50" y1="36.5" x2="50" y2="63.5" stroke="#FFFFFF" stroke-width="7.5" stroke-linecap="round"/>
      <circle cx="50" cy="27.5" r="4" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Outer Infrastructure Nodes -->
  <!-- Node 1: Edge Gateway -->
  <g transform="translate(120, 180)">
    <circle r="22" fill="#FFFFFF" stroke="#071A2B" stroke-width="2"/>
    <circle r="6" fill="#1677FF"/>
    <text x="0" y="36" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#102A43" text-anchor="middle">IoT Edge</text>
  </g>

  <!-- Node 2: CI/CD Cluster -->
  <g transform="translate(260, 110)">
    <circle r="20" fill="#FFFFFF" stroke="#071A2B" stroke-width="2"/>
    <circle r="5.5" fill="#22D3EE"/>
    <text x="0" y="-28" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#102A43" text-anchor="middle">DevOps GitOps</text>
  </g>

  <!-- Node 3: Cloud Region -->
  <g transform="translate(440, 130)">
    <circle r="24" fill="#FFFFFF" stroke="#071A2B" stroke-width="2"/>
    <circle r="7" fill="#1677FF"/>
    <text x="0" y="-32" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#102A43" text-anchor="middle">Multi-Region Cloud</text>
  </g>

  <!-- Node 4: Stream Ingestion -->
  <g transform="translate(220, 280)">
    <circle r="18" fill="#FFFFFF" stroke="#071A2B" stroke-width="2"/>
    <circle r="5" fill="#35A7FF"/>
    <text x="0" y="32" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#102A43" text-anchor="middle">Kafka / MQTT</text>
  </g>

  <!-- Node 5: Serverless Compute -->
  <g transform="translate(380, 290)">
    <circle r="22" fill="#FFFFFF" stroke="#071A2B" stroke-width="2"/>
    <circle r="6" fill="#22D3EE"/>
    <text x="0" y="36" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#102A43" text-anchor="middle">Serverless APIs</text>
  </g>

  <!-- Node 6: Analytics & BI -->
  <g transform="translate(500, 240)">
    <circle r="20" fill="#FFFFFF" stroke="#071A2B" stroke-width="2"/>
    <circle r="5.5" fill="#1677FF"/>
    <text x="0" y="34" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#102A43" text-anchor="middle">BI Dashboards</text>
  </g>
</svg>
