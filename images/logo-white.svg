<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 52" width="260" height="52">
  <!-- Satellite Tech Official Hexagonal Monogram Emblem for Dark Backgrounds (Transparent BG) -->
  <g transform="translate(6, 4) scale(0.44)">
    <!-- Outer Hexagon -->
    <polygon points="50,6 88.1,28 88.1,72 50,94 11.9,72 11.9,28" 
             fill="none" 
             stroke="#35A7FF" 
             stroke-width="7.5" 
             stroke-linejoin="round" 
             stroke-linecap="round"/>
    
    <!-- Inner S Path -->
    <path d="M 66,31.2 L 50,22 L 27,35.3 L 27,50 L 73,50 L 73,64.7 L 50,78 L 34,68.8" 
          fill="none" 
          stroke="#22D3EE" 
          stroke-width="7" 
          stroke-linejoin="round" 
          stroke-linecap="round"/>
    
    <!-- Center Stem -->
    <line x1="50" y1="36.5" x2="50" y2="63.5" 
          stroke="#22D3EE" 
          stroke-width="7" 
          stroke-linecap="round"/>
    
    <!-- Center Dot -->
    <circle cx="50" cy="27.5" r="3.8" fill="#22D3EE"/>
  </g>
  
  <!-- Text Wordmark -->
  <text x="58" y="27" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" letter-spacing="-0.3px">
    SATELLITE <tspan fill="#35A7FF">TECH</tspan>
  </text>
  <text x="58" y="41" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#9FB3C8" letter-spacing="1.4px">
    CLOUD • DEVOPS • IOT
  </text>
</svg>
