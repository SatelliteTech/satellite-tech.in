<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" width="100%" height="100%">
  <rect width="500" height="360" fill="#FFFFFF" rx="12" stroke="#D9E2EC" stroke-width="1.5"/>
  
  <!-- Header Bar -->
  <rect x="0" y="0" width="500" height="42" fill="#071A2B" rx="12"/>
  <rect x="0" y="30" width="500" height="12" fill="#071A2B"/>
  <circle cx="24" cy="21" r="5" fill="#EF4444"/>
  <circle cx="40" cy="21" r="5" fill="#F59E0B"/>
  <circle cx="56" cy="21" r="5" fill="#10B981"/>
  <text x="250" y="26" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle">SATELLITE TECH REFERENCE ARCHITECTURE</text>

  <!-- Layers -->
  <!-- Layer 1: Client & User Applications -->
  <g transform="translate(30, 60)">
    <rect width="440" height="52" rx="8" fill="#F7FAFC" stroke="#D9E2EC" stroke-width="1.2"/>
    <text x="20" y="30" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#071A2B">1. PRESENTATION &amp; APPLICATIONS</text>
    <text x="420" y="30" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#1677FF" text-anchor="end">Web Apps &bull; Mobile &bull; GraphQL / REST</text>
  </g>

  <!-- Layer 2: API Gateway & Service Mesh -->
  <g transform="translate(30, 126)">
    <rect width="440" height="52" rx="8" fill="#F7FAFC" stroke="#D9E2EC" stroke-width="1.2"/>
    <text x="20" y="30" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#071A2B">2. API GATEWAY &amp; SERVICE MESH</text>
    <text x="420" y="30" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#1677FF" text-anchor="end">Zero-Trust &bull; Rate Limiting &bull; Auth</text>
  </g>

  <!-- Layer 3: Cloud Compute & Microservices -->
  <g transform="translate(30, 192)">
    <rect width="440" height="52" rx="8" fill="#F7FAFC" stroke="#D9E2EC" stroke-width="1.2"/>
    <text x="20" y="30" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#071A2B">3. CLOUD COMPUTE &amp; SERVERLESS</text>
    <text x="420" y="30" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#1677FF" text-anchor="end">Kubernetes &bull; Event Triggers &bull; IaC</text>
  </g>

  <!-- Layer 4: Edge IoT & Data Store -->
  <g transform="translate(30, 258)">
    <rect width="440" height="52" rx="8" fill="#F7FAFC" stroke="#D9E2EC" stroke-width="1.2"/>
    <text x="20" y="30" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#071A2B">4. IOT EDGE &amp; DISTRIBUTED STORAGE</text>
    <text x="420" y="30" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#1677FF" text-anchor="end">Gateways &bull; MQTT &bull; Time-Series DB</text>
  </g>

  <!-- Flow Connector Indicators -->
  <circle cx="250" cy="119" r="4" fill="#1677FF"/>
  <circle cx="250" cy="185" r="4" fill="#1677FF"/>
  <circle cx="250" cy="251" r="4" fill="#1677FF"/>
</svg>
